<main class="grow">
  <section
    class="hero-bg-base pt-20 pb-40 px-6 md:px-12 relative rounded-2xl" [ngClass]="isDarkMode() ? 'mask-dark' : 'mask-light'">
    <div class="max-w-7xl mx-auto">
      <div class="max-w-2xl rounded-2xl relative z-10">
        <div class="w-12 h-1 bg-secondary mb-6"></div>
        <p class="pointer-events-none select-none inline-block px-4 py-1 rounded-full bg-secondary-container text-on-secondary-container text-xs font-bold tracking-widest uppercase mb-6">tu salud primero</p>
        <h1 class="pointer-events-none select-none text-5xl md:text-6xl font-bold text-primary leading-tight mb-6">Su aliado de confianza<br/>en salud</h1>
        <p class="pointer-events-none select-none text-lg text-text-muted mb-8 max-w-xl leading-relaxed">Trout es una plataforma de salud comunitaria que prioriza el bienestar de la población Chiquinquireña</p>
        <a class="inline-flex items-center bg-secondary hover:bg-opacity-90 text-white font-bold py-3 px-8 rounded-btn transition-colors shadow-md text-sm tracking-wide" href="#">EXPLORAR MÁS <span class="material-symbols-outlined ml-2 text-base">chevron_right</span>
        </a>
      </div>
    </div>
  </section>

  <div class="max-w-7xl mx-auto px-6 md:px-12 -mt-24 relative z-10">
    <app-floating-cards />
    <app-key-insights />
    <app-content-row />
  </div>
</main>
