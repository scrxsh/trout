<div class="fixed inset-0 z-50 flex items-center justify-center bg-on-background/40 backdrop-blur-sm" (click)="cerrar.emit()">
  <div class="bg-surface rounded-xl shadow-[0_12px_32px_rgba(27,27,27,0.06)] w-full max-w-lg overflow-hidden flex flex-col relative z-10 border border-outline-variant/15" (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="flex items-center justify-between p-6 pb-4">
      <h2 class="font-headline text-xl font-bold text-on-surface tracking-tight">{{ alerta() ? 'Editar alerta' : 'Nueva alerta' }}</h2>
      <button aria-label="Cerrar" class="text-on-surface-variant hover:text-primary transition-colors p-2 rounded-full hover:bg-surface-container/20" type="button">
        <span aria-hidden="true" class="material-symbols-outlined" (click)="cerrar.emit()">close</span>
      </button>
    </div>
    <!-- Form Body -->
    <div class="p-6 pt-2 space-y-6 grow overflow-y-auto">
    <!-- Título Field -->
      <div class="space-y-2">
        <label class="input-title" for="titulo">Título <span class="text-secondary">*</span></label>
        <input class="input-form"
          id="titulo" name="titulo"
          [value]="form().titulo"
          (input)="patchForm({ titulo: $any($event.target).value })"
          placeholder="Título de la alerta"
          type="text"/>
      </div>
      <!-- Descripción Field -->
      <div class="space-y-2">
        <label class="input-title" for="descripcion">Descripción <span class="text-secondary">*</span></label>
          <textarea class="input-form resize-none"
            id="descripcion" name="descripcion"
            [value]="form().descripcion"
            (input)="patchForm({ descripcion: $any($event.target).value })"
            placeholder="Descripción detallada..."
            rows="4">
          </textarea>
      </div>
      <!-- Fecha Field -->
      <div class="space-y-2">
        <label class="input-title" for="fecha">Fecha</label>
        <div class="space-y-2">
          <input class="input-form pr-10"
          id="fecha" name="fecha"
          [value]="form().fecha"
          (change)="patchForm({ fecha: $any($event.target).value })"
          type="date"/>
        </div>
      </div>
      <!-- Tipo and Estado Row -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Tipo Select -->
        <div class="space-y-2">
          <label class="input-title" for="tipo">Tipo</label>
          <div class="relative">
            <select class="input-form appearance-none pr-10" id="tipo" name="tipo" [value]="form().tipo" (change)="patchForm({ tipo: $any($event.target).value })" >
                @for (tipo of tiposAlerta; track tipo) {
                  <option [value]="tipo" class="bg-surface text-on-surface">{{ tipo }}</option>
                }
            </select>
          </div>
        </div>

        <!-- Estado Select -->
        <div class="space-y-2">
          <label class="input-title" for="estado">Estado</label>
          <div class="relative">
            <select class="input-form appearance-none pr-10" id="estado" name="estado" [value]="form().estado" (change)="patchForm({ estado: $any($event.target).value })" >
                @for (estado of estadosAlerta; track estado) {
                  <option [value]="estado" class="bg-surface text-on-surface">{{ estado }}</option>
                }
            </select>
          </div>
        </div>
      </div>
      <!-- Destacada Checkbox -->
      <div class="flex items-center pt-2">
        <input class="checkbox-s" id="destacada" type="checkbox" [checked]="form().destacada" (change)="patchForm({ destacada: $any($event.target).checked })"/>
        <label class="ml-3 block text-base text-on-surface cursor-pointer select-none" for="destacada">Marcar como alerta destacada</label>
      </div>
    </div>
    <!-- Footer Actions -->
    <div class="bg-surface-container-low p-6 flex items-center justify-end gap-4 rounded-b-xl border-t border-outline-variant/15">
      <button (click)="cerrar.emit()" class="px-6 py-3 rounded-full font-label font-bold text-sm tracking-wide text-tertiary border-2 border-outline-variant/30 hover:bg-surface-container/50 transition-colors focus:outline-none focus:ring-2 focus:ring-tertiary focus:ring-offset-2 cursor-pointer" type="button">Cancelar</button>
      <button (click)="onGuardar()" class="px-6 py-3 rounded-full font-label font-bold text-sm tracking-wide text-on-primary bg-primary shadow-sm hover:shadow-md hover:scale-[1.02] active:scale-95 transition-all flex items-center gap-2 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="button">
      <span class="material-symbols-outlined">save</span>{{ alerta() ? 'Guardar cambios' : 'Crear alerta' }}</button>
    </div>
  </div>
</div>
