<div class="flex flex-wrap gap-5 w-full pt-2">
  @if(isBrowser){
    <div class="grid grid-cols-3 gap-6 w-full h-1/6">
        <!--GRAFICO DE BARRAS-->
        <div class="chart-card rounded-2xl" id="barras">
          <h2 class="chart-title">Reportes por barrios</h2>
          <p class="chart-subtitle">Reportes realizados por cada barrio de la ciudad</p>
              <div class="chart-wrapper h-[80%]">
              <canvas
                  baseChart
                  [data]="barChartData"
                  [options]="chartOptions()"
                  [type]="barChartType">
              </canvas>
              </div>
        </div>
        <!--GRAFICO DE PASTEL-->
        <div class="chart-card rounded-2xl" id="pastel">
          <h2 class="chart-title">Distribución de Enfermedades</h2>
          <p class="chart-subtitle">Proporción de casos por tipo de enfermedad</p>
              <div class="chart-wrapper h-[80%]">
              <canvas
                  baseChart
                  [data]="pieChartData"
                  [options]="chartOptions()"
                  [type]="pieChartType">
              </canvas>
              </div>
        </div>
        <!--MAPA DE CALOR-->
        <div class="bg-surface p-8 rounded-3xl shadow-[0_12px_32px_rgba(27,27,27,0.04)] border border-outline-variant/5 flex flex-col">
          <h2 class="text-xl font-bold text-on-surface mb-1">Mapa de calor</h2>
          <p class="text-sm text-outline mb-6">Concentración geográfica de alertas en Chiquinquirá</p>
          <div class="flex-1 relative rounded-2xl overflow-hidden bg-surface-container">
              <div class="w-full h-75 object-cover opacity-90" id="mapa">
                <app-heatmap></app-heatmap>
              </div>
          </div>
          <div class="mt-3 space-y-3 h-15">
            <div class="flex justify-between items-center text-xs">
              <span class="font-medium">Zona A - Gran Riesgo</span>
              <span class="px-2 py-1 bg-secondary-container text-on-secondary-container rounded-lg font-bold">84 Alertas</span>
            </div>
          <div class="flex justify-between items-center text-xs">
            <span class="font-medium">Zona C - Moderado</span>
            <span class="px-2 py-1 bg-tertiary-container/10 text-tertiary-container rounded-lg font-bold">32 Alertas</span>
          </div>
        </div>
      </div>
    </div>
  }
</div>
